<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GitLab Branch — UI preview</title><link rel="stylesheet" href="/preview.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#e9ebef}button,select{font:inherit}button{cursor:pointer}.preview-controls{display:flex;gap:10px;align-items:center;padding:12px 16px;background:#172029;color:#e5eaf0;font-size:12px;flex-wrap:wrap}.preview-controls select,.preview-controls button{border:1px solid #465160;border-radius:5px;padding:5px 8px;color:#e5eaf0;background:#24313d}.preview-layout{display:flex;align-items:flex-start;gap:24px;padding:20px}.preview-layout>details{font-size:12px;max-width:400px}.preview-layout>details>pre{white-space:pre-wrap;max-width:400px}.preview-frame{height:850px;border:1px solid #c8cdd5;border-radius:10px;overflow:hidden;box-shadow:0 5px 30px #00000015;--foreground:#232a33;--muted-foreground:#69727e;--border:#dce0e6;--card:#fff;--background:#fff;--accent:#f0f2f5;--ring:#3289df;--primary:#287bc5}.dark .preview-frame{--foreground:#e2e6ec;--muted-foreground:#8e99a8;--border:#303943;--card:#1e252d;--background:#192028;--accent:#2a333e;--ring:#73aff1;--primary:#73aff1;border-color:#303943}.preview-markdown{line-height:1.65}.preview-markdown p{margin:0 0 8px}@media(max-width:550px){.preview-layout{padding:10px}.preview-layout>details{display:none}}</style><div id="root"></div><script type="module" src="/preview.js"></script></html>
